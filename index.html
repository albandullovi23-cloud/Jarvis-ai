
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS 2.0</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030914;color:#d8f5ff;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;justify-content:center;
}
.app{width:100%;max-width:850px;padding:22px}
header{text-align:center;padding:20px 0}
h1{letter-spacing:9px;color:#36cfff;text-shadow:0 0 18px #008cff}
.status{font-size:12px;color:#6de7ff;letter-spacing:3px}
.reactor{
 width:150px;height:150px;border-radius:50%;
 border:3px solid #28caff;margin:22px auto;
 display:flex;align-items:center;justify-content:center;
 box-shadow:0 0 25px #008cff,inset 0 0 25px #008cff;
 animation:pulse 3s infinite;
}
.reactor span{font-size:35px;color:#7ceaff}
@keyframes pulse{50%{box-shadow:0 0 45px #008cff,inset 0 0 35px #008cff}}
.panel{
 background:#071827;border:1px solid #14516b;
 border-radius:14px;padding:15px;margin:14px 0;
}
#chat{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{padding:11px 13px;border-radius:10px;max-width:90%;line-height:1.5;white-space:pre-wrap}
.user{align-self:flex-end;background:#103b58}
.bot{align-self:flex-start;background:#09283a;border:1px solid #14516b}
input{
 width:100%;background:#020d18;color:white;
 border:1px solid #176080;border-radius:9px;
 padding:14px;font-size:16px;outline:none
}
button{
 background:#063b59;color:#7ceaff;border:1px solid #1686b5;
 padding:12px 16px;border-radius:9px;
 font-size:14px;cursor:pointer
}
button:active{background:#0876a5}
.controls{display:flex;gap:8px;margin-top:10px}
.controls button{flex:1}
.small{font-size:12px;color:#83aebe}
#status{color:#59dfff;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="status">PERSONAL AI SYSTEM · ONLINE</div>
 <h1>J.A.R.V.I.S</h1>
 <div class="small">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
 <div class="reactor"><span>J</span></div>
 <div id="status">JARVIS 2.0 READY</div>
</header>

<div class="panel">
 <div class="small">AI CONVERSATION</div>
 <div id="chat"></div>
 <input id="message" placeholder="Kirjoita JARVISille..." autocomplete="off">
 <div class="controls">
  <button onclick="sendMessage()">SEND</button>
  <button onclick="startVoice()">🎙 SPEAK</button>
  <button onclick="clearChat()">CLEAR</button>
 </div>
 <div class="controls">
  <button onclick="toggleSpeech()">🔊 VOICE ON/OFF</button>
 </div>
</div>

<div class="panel">
 <div class="small">SYSTEM INFORMATION</div>
 <p id="clock">--:--:--</p>
 <p class="small">AI ENGINE: GEMINI · VERSION 2.0</p>
 <p class="small">MEMORY: LOCAL BROWSER STORAGE</p>
</div>
</div>

<script>
const API_URL = "https://jarvis-ai.workers.dev/chat";
</script>
</body>
</html>
